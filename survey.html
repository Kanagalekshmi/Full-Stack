<!DOCTYPE html>
<html>
<head>
    <title>Customer Survey | Retail Co.</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #0d6efd; }
        .navbar-brand { font-weight: bold; color: white !important; }
        
        .survey-container { margin-top: 50px; margin-bottom: 50px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn-custom { background: #0d6efd; color: white; border-radius: 8px; padding: 10px; font-weight: 600; }
        
        /* Star Rating */
        .star-rating { direction: rtl; display: inline-block; padding: 20px 0; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 30px; color: #ddd; cursor: pointer; transition: 0.2s; }
        .star-rating label:hover, .star-rating label:hover ~ label,
        .star-rating input:checked ~ label { color: #f39c12; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand" href="/">RETAIL CO.</a>
</nav>

<div class="container survey-container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5">
                <h2 class="text-center mb-4" style="color: #0d6efd;">Feedback Form</h2>
                <form action="/submitSurvey" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Service Category</label>
                        <select name="service" class="form-select">
                            <option>Electronics</option>
                            <option>Clothing</option>
                            <option>Groceries</option>
                        </select>
                    </div>
                    <div class="text-center">
                        <label class="form-label fw-bold d-block">Overall Rating</label>
                        <div class="star-rating">
                            <input type="radio" name="rating" value="5" id="5"><label for="5">★</label>
                            <input type="radio" name="rating" value="4" id="4"><label for="4">★</label>
                            <input type="radio" name="rating" value="3" id="3"><label for="3">★</label>
                            <input type="radio" name="rating" value="2" id="2"><label for="2">★</label>
                            <input type="radio" name="rating" value="1" id="1"><label for="1">★</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Any Suggestions?</label>
                        <textarea name="suggestion" class="form-control" rows="3"></textarea>
                    </div>
                    <button class="btn btn-custom w-100 mt-3">SUBMIT FEEDBACK</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
